<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Ben Hur Andrade</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script><script src="core.js"></script></head>
<body><div class="admin">
<aside class="side"><div class="brand"><div class="mark"></div><b>ADMIN</b></div>
  <a data-r="painel"><i></i>Painel</a><a data-r="empresas"><i style="color:var(--accent)"></i>Empresas</a><a data-r="contratos"><i style="color:var(--accent)"></i>Contratos</a><a data-r="faturas"><i style="color:var(--accent)"></i>Faturas</a>
  <div class="sec mono">Geral</div><a data-r="solicitacoes"><i style="color:var(--warn)"></i>Solicitações</a><a data-r="nps"><i style="color:var(--ok)"></i>NPS e oportunidades</a>
  <div class="sec mono">Sistema</div><a data-r="usuarios"><i></i>Usuários e convites</a><a data-r="automacoes"><i></i>Automações</a><a data-r="catalogo"><i></i>Catálogo e valores</a>
  <div class="sec"></div><a href="index.html" target="_blank"><i style="color:var(--ok)"></i>Ver como cliente</a><a onclick="signOut()"><i style="color:var(--bad)"></i>Sair</a>
</aside>
<main class="main" id="main"><div class="empty">Carregando...</div></main></div>
<script>
let ME, COS = [], CAT = [], CUR = localStorage.getItem('admin_company') || '';
const main = $('#main'); let OUT = main, WS = false;
async function boot() { const r = await requireSession({ admin: true }); if (!r) return; ME = r.me; await refreshBase(); $$('.side a[data-r]').forEach(a => a.onclick = () => location.hash = a.dataset.r); addEventListener('hashchange', route); route(); }
async function refreshBase() { const [{ data: c }, { data: k }] = await Promise.all([sb.from('companies').select('*').order('name'), sb.from('services_catalog').select('*').order('sort')]); COS = c || []; CAT = k || []; if (!CUR && COS[0]) CUR = COS[0].id; }
const WS_TABS = [['resumo','Resumo'],['contrato','Contrato e faturas'],['criativos','Criativos'],['documentos','Biblioteca da marca'],['evolucao','Quadro evolutivo'],['metricas','Métricas'],['solicitacoes','Solicitações'],['usuarios','Usuários']];
function route() { const r = (location.hash || '#painel').slice(1); WS = false; OUT = main;
  if (r.startsWith('empresa/')) { const [, id, tab] = r.split('/'); return workspace(id, tab || 'resumo'); }
  $$('.side a').forEach(a => a.classList.toggle('on', a.dataset.r === r)); ({ painel, empresas, contratos, faturas, solicitacoes, nps, usuarios, automacoes, catalogo }[r] || painel)(); }
function openCompany(id, tab = 'resumo') { location.hash = 'empresa/' + id + '/' + tab; }
async function workspace(id, tab) { const c = COS.find(x => x.id === id); if (!c) return empresas(); CUR = id; localStorage.setItem('admin_company', CUR); WS = true; $$('.side a').forEach(a => a.classList.toggle('on', a.dataset.r === 'empresas'));
  main.innerHTML = `<div style="display:flex;align-items:center;gap:16px;margin-bottom:6px"><a class="btn sm ghost" onclick="location.hash='empresas'">‹ Empresas</a><div class="logo-prev" style="width:48px;height:48px;border-radius:12px">${c.logo_url ? `<img src="${esc(publicUrl('logos', c.logo_url))}">` : '◎'}</div><div><div class="page-title" style="margin:0;font-size:22px">${esc(c.name)}</div><div class="page-sub" style="margin:0">${esc(c.segment || '')} ${c.active ? '' : '· <span class="badge bad">inativa</span>'}</div></div><span style="flex:1"></span><a class="btn sm ghost" href="index.html" target="_blank" onclick="localStorage.setItem('portal_company','${c.id}')">Ver como cliente</a><button class="btn sm ghost" onclick="editCompany('${c.id}')">Editar cadastro</button></div>
  <div class="tabs" style="margin:10px 0 22px;gap:18px;border-bottom:1px solid var(--line);padding-bottom:10px">${WS_TABS.map(t => `<a class="${t[0] === tab ? 'on' : ''}" onclick="openCompany('${c.id}','${t[0]}')">${t[1]}</a>`).join('')}</div><div id="ws"></div>`;
  OUT = $('#ws'); ({ resumo: resumoEmpresa, contrato: contratoEmpresa, criativos, documentos, evolucao, metricas, solicitacoes: solicitacoesEmpresa, usuarios: usuariosEmpresa }[tab] || resumoEmpresa)(); }
const coName = id => COS.find(c => c.id === id)?.name || '?';
function coSelect(onchange = 'CUR=this.value;localStorage.setItem(\'admin_company\',CUR);route()') { if (WS && onchange !== '') return ''; return `<select onchange="${onchange}">${COS.map(c => `<option value="${c.id}" ${c.id === CUR ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>`; }
const wsHead = (s, extra = '') => `<div class="toolbar"><div class="page-sub" style="margin:0">${s}</div><span class="sp"></span>${extra}</div>`;
const head = (t, s, extra = '') => `<div class="toolbar"><div><div class="page-title">${t}</div><div class="page-sub" style="margin:0">${s}</div></div><span class="sp"></span>${extra}</div>`;

/* ===== PAINEL ===== */
async function painel() { const [{ data: inv }, { data: cr }, { data: rq }, { data: np }, { data: oc }] = await Promise.all([sb.from('invoices').select('company_id,amount,status,due_date'), sb.from('creatives').select('company_id,status'), sb.from('requests').select('company_id,status'), sb.from('nps_responses').select('company_id,score,created_at'), sb.from('offer_clicks').select('company_id,service_key,created_at').order('created_at', { ascending: false }).limit(10)]);
  const today = new Date().toISOString().slice(0, 10); const in7 = new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10);
  const overdue = (inv || []).filter(i => i.status === 'open' && i.due_date < today), due7 = (inv || []).filter(i => i.status === 'open' && i.due_date >= today && i.due_date <= in7);
  const mrr = COS.reduce((s, c) => s, 0);
  OUT.innerHTML = head('Painel', 'Visão geral de todas as empresas.') + `<div class="grid4"><div class="stat"><small>Empresas ativas</small><b>${COS.filter(c => c.active).length}</b></div><div class="stat"><small>Faturas atrasadas</small><b style="color:${overdue.length ? 'var(--bad)' : 'inherit'}">${overdue.length}</b><small>${money(overdue.reduce((s, i) => s + Number(i.amount), 0))}</small></div><div class="stat"><small>Vencendo em 7 dias</small><b>${due7.length}</b><small>${money(due7.reduce((s, i) => s + Number(i.amount), 0))}</small></div><div class="stat"><small>Solicitações abertas</small><b>${(rq || []).filter(r => r.status !== 'done').length}</b></div></div>
  <div class="card" style="margin-top:14px"><h3>Empresas</h3><table><thead><tr><th>Empresa</th><th>Financeiro</th><th>Criativos pendentes</th><th>Solicitações</th><th>NPS</th><th></th></tr></thead><tbody>${COS.map(c => { const ci = (inv || []).filter(i => i.company_id === c.id); const od = ci.filter(i => i.status === 'open' && i.due_date < today).length, d7 = ci.filter(i => i.status === 'open' && i.due_date >= today && i.due_date <= in7).length; const ns = (np || []).filter(n => n.company_id === c.id); const avg = ns.length ? (ns.reduce((s, n) => s + n.score, 0) / ns.length).toFixed(1) : '–';
    return `<tr><td><b>${esc(c.name)}</b><br><small style="color:var(--muted)">${esc(c.segment || '')}</small></td><td><span class="badge ${od ? 'bad' : d7 ? 'warn' : 'ok'}">${od ? od + ' atrasada(s)' : d7 ? 'vence em 7 dias' : 'Em dia'}</span></td><td>${(cr || []).filter(x => x.company_id === c.id && x.status === 'pending').length}</td><td>${(rq || []).filter(x => x.company_id === c.id && x.status !== 'done').length}</td><td>${avg}</td><td><a class="btn sm ghost" onclick="openCompany('${c.id}')">Abrir espaço</a></td></tr>`; }).join('')}</tbody></table></div>
  ${(oc || []).length ? `<div class="card" style="margin-top:14px"><h3>Oportunidades (cliques em "Quero contratar")</h3>${oc.map(o => `<div class="kv"><span>${esc(coName(o.company_id))} · ${esc(CAT.find(s => s.key === o.service_key)?.label || o.service_key)}</span><b>${dt(o.created_at.slice(0, 10))}</b></div>`).join('')}</div>` : ''}`; }

/* ===== EMPRESAS ===== */
async function empresas() { const [{ data: inv }, { data: cr }] = await Promise.all([sb.from('invoices').select('company_id,status,due_date'), sb.from('creatives').select('company_id,status')]); const today = new Date().toISOString().slice(0, 10);
  OUT.innerHTML = head('Empresas', 'Cada empresa tem o próprio espaço: contrato, faturas, criativos, biblioteca, evolução, métricas e usuários.', `<button class="btn primary" onclick="editCompany()">+ Nova empresa</button>`) + `<div class="grid3">${COS.map(c => { const ci = (inv || []).filter(i => i.company_id === c.id); const od = ci.filter(i => i.status === 'open' && i.due_date < today).length; const rv = ci.filter(i => i.status === 'review').length; const pend = (cr || []).filter(x => x.company_id === c.id && x.status === 'pending').length;
    return `<div class="card" style="cursor:pointer;display:flex;gap:14px;align-items:center" onclick="openCompany('${c.id}')"><div class="logo-prev" style="width:56px;height:56px">${c.logo_url ? `<img src="${esc(publicUrl('logos', c.logo_url))}">` : '◎'}</div><div style="min-width:0"><b style="font-size:16px;display:block">${esc(c.name)}</b><small style="color:var(--muted)">${esc(c.segment || '')}</small><div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><span class="badge ${od ? 'bad' : rv ? 'warn' : 'ok'}">${od ? od + ' fatura(s) atrasada(s)' : rv ? rv + ' comprovante(s) p/ confirmar' : 'Financeiro em dia'}</span>${pend ? `<span class="badge gold">${pend} criativo(s) p/ aprovar</span>` : ''}${c.active ? '' : '<span class="badge bad">inativa</span>'}</div></div><span style="margin-left:auto;color:var(--muted);font-size:22px">›</span></div>`; }).join('') || '<div class="card empty">Nenhuma empresa ainda.</div>'}</div>`; }
async function resumoEmpresa() { const c = COS.find(x => x.id === CUR); if (!c) return;
  const [{ data: roles }, { data: ct }] = await Promise.all([sb.from('user_roles').select('role, profiles:user_id(full_name,email)').eq('company_id', c.id), sb.from('contracts').select('number,status,monthly_amount,due_day,start_date,end_date').eq('company_id', c.id).order('created_at', { ascending: false })]);
  const b = c.brand || {};
  OUT.innerHTML = `
  <div class="grid2"><div class="card"><div style="display:flex;gap:16px;align-items:center"><div class="logo-prev">${c.logo_url ? `<img src="${esc(publicUrl('logos', c.logo_url))}">` : '◎'}</div><div><b style="font-size:18px">${esc(c.name)}</b><p style="color:var(--muted);font-size:13px">${esc(c.legal_name || '')} ${c.cnpj ? '· CNPJ ' + esc(c.cnpj) : ''}</p><p style="color:var(--muted);font-size:13px">${esc([c.address, c.city, c.state, c.cep].filter(Boolean).join(', '))}</p></div></div>
    <div class="kv" style="margin-top:12px"><span>Instagram</span><b>${esc(c.instagram || '–')}</b></div><div class="kv"><span>WhatsApp</span><b>${esc(c.whatsapp || '–')}</b></div><div class="kv"><span>Contato</span><b>${esc(c.contact_name || '–')} ${c.contact_email ? '· ' + esc(c.contact_email) : ''}</b></div><div class="kv"><span>Site</span><b>${esc(c.website || '–')}</b></div><div class="kv"><span>Ativa</span><b>${c.active ? 'Sim' : 'Não'}</b></div></div>
  <div class="card"><h3>Marca</h3><div class="kv"><span>Cores</span><b><span class="swatches">${(b.colors || []).map(x => `<i style="background:${esc(x)}"></i>`).join('') || '–'}</span></b></div><div class="kv"><span>Fontes</span><b>${esc((b.fonts || []).join(' · ') || '–')}</b></div><div class="kv"><span>Tom de voz</span><b style="font-weight:400;text-align:left">${esc(b.tone || '–')}</b></div><div class="kv"><span>Observações</span><b style="font-weight:400;text-align:left">${esc(b.notes || '–')}</b></div><p class="hint">Logo, cores e fontes aparecem no painel do cliente em Documentos e marca. Arquivos (brand book, logo em vetor) ficam na Biblioteca da marca.</p></div></div>
  <div class="grid2" style="margin-top:14px"><div class="card"><h3>Usuários <a class="btn sm ghost" style="margin-left:auto" onclick="openCompany('${c.id}','usuarios')">gerenciar</a></h3>${(roles || []).map(r => `<div class="mem"><div class="avatar" style="width:34px;height:34px;font-size:12px">${initials(r.profiles?.full_name || r.profiles?.email)}</div><div><b>${esc(r.profiles?.full_name || '')}</b><p>${esc(r.profiles?.email || '')}</p></div><span class="badge ${r.role === 'company_admin' ? 'ok' : ''}">${r.role === 'company_admin' ? 'Admin' : 'Gerente'}</span></div>`).join('') || '<div class="empty">Ninguém ainda. Gere um convite em Usuários e convites.</div>'}</div>
  <div class="card"><h3>Contratos <a class="btn sm ghost" style="margin-left:auto" onclick="openCompany('${c.id}','contrato')">abrir</a></h3>${(ct || []).map(x => `<div class="kv"><span>${esc(x.number)} · ${dtShort(x.start_date)} a ${dtShort(x.end_date)}</span><b>${money(x.monthly_amount)}/mês · <span class="badge ${x.status === 'signed' ? 'ok' : ''}">${{ draft: 'Rascunho', sent: 'Enviado', signed: 'Assinado', ended: 'Encerrado' }[x.status]}</span></b></div>`).join('') || '<div class="empty">Sem contrato. Crie em Contratos.</div>'}</div></div>`; }
function editCompany(id) { const c = COS.find(x => x.id === id) || { brand: {} }; const b = c.brand || {};
  const f = (k, l, v = c[k]) => `<label class="f"><span>${l}</span><input id="c_${k}" value="${esc(v || '')}"></label>`;
  modal(`<h2>${id ? 'Editar empresa' : 'Nova empresa'}</h2><div class="row2">${f('name', 'Nome (marca)')}${f('cnpj', 'CNPJ')}</div><div class="row2">${f('legal_name', 'Razão social')}${f('entity_type', 'Tipo (Ltda, associação...)')}</div><div class="row2">${f('segment', 'Segmento')}${f('website', 'Site')}</div>${f('address', 'Endereço')}<div class="row3">${f('city', 'Cidade')}${f('state', 'UF')}${f('cep', 'CEP')}</div><div class="row3">${f('instagram', 'Instagram')}${f('facebook', 'Facebook')}${f('tiktok', 'TikTok')}</div><div class="row3">${f('whatsapp', 'WhatsApp')}${f('contact_name', 'Nome do contato')}${f('contact_email', 'E-mail do contato')}</div>
  <div class="mono" style="margin-top:16px">Marca</div><div class="row2">${f('colors', 'Cores (hex separados por vírgula)', (b.colors || []).join(', '))}${f('fonts', 'Fontes (separadas por vírgula)', (b.fonts || []).join(', '))}</div><label class="f"><span>Tom de voz</span><textarea id="c_tone">${esc(b.tone || '')}</textarea></label><label class="f"><span>Observações internas</span><textarea id="c_notes">${esc(b.notes || '')}</textarea></label>
  <label class="f"><span>Logo (PNG/SVG/JPG)</span><input type="file" id="c_logo" accept="image/*"></label><label class="f" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="c_active" ${c.active !== false ? 'checked' : ''} style="width:16px"> <span style="margin:0">Empresa ativa</span></label>
  <div class="md-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveCompany('${id || ''}')">Salvar</button></div>`, { width: 'min(760px,100%)' }); }
async function saveCompany(id) { const v = k => $('#c_' + k).value.trim(); const row = { name: v('name'), cnpj: v('cnpj'), legal_name: v('legal_name'), entity_type: v('entity_type'), segment: v('segment'), website: v('website'), address: v('address'), city: v('city'), state: v('state'), cep: v('cep'), instagram: v('instagram'), facebook: v('facebook'), tiktok: v('tiktok'), whatsapp: v('whatsapp'), contact_name: v('contact_name'), contact_email: v('contact_email'), active: $('#c_active').checked, brand: { colors: v('colors').split(',').map(s => s.trim()).filter(Boolean), fonts: v('fonts').split(',').map(s => s.trim()).filter(Boolean), tone: $('#c_tone').value, notes: $('#c_notes').value } };
  if (!row.name) return toast('Nome é obrigatório', 'bad');
  let res = id ? await sb.from('companies').update(row).eq('id', id).select().single() : await sb.from('companies').insert(row).select().single(); if (res.error) return toast(res.error.message, 'bad'); const co = res.data;
  const file = $('#c_logo').files[0]; if (file) { const path = `${co.id}/logo_${Date.now()}.${file.name.split('.').pop()}`; const up = await sb.storage.from('logos').upload(path, file, { upsert: true }); if (up.error) toast('Logo: ' + up.error.message, 'bad'); else await sb.from('companies').update({ logo_url: path }).eq('id', co.id); }
  closeModal(); toast('Empresa salva', 'ok'); CUR = co.id; localStorage.setItem('admin_company', CUR); await refreshBase(); route(); }

/* ===== CONTRATOS ===== */
async function contratos() { const { data } = await sb.from('contracts').select('*, contract_services(service_key)').order('created_at', { ascending: false });
  OUT.innerHTML = head('Contratos', 'Todos os contratos. Para criar, entre no espaço da empresa.', '') + `<div class="card">${contractRows(data || [])}</div>`; }
function contractRows(data) { return `<table><thead><tr><th>Nº</th><th>Empresa</th><th>Vigência</th><th>Mensalidade</th><th>Frentes</th><th>Fluxo</th><th>Status</th><th></th></tr></thead><tbody>${(data || []).map(c => `<tr><td><b>${esc(c.number)}</b></td><td>${esc(coName(c.company_id))}</td><td>${dtShort(c.start_date)} a ${dtShort(c.end_date)}</td><td>${money(c.monthly_amount)} · dia ${c.due_day}</td><td>${c.contract_services.length}</td><td style="font-size:12px;color:var(--muted);white-space:nowrap">${c.signed_at ? '✔ assinado ' + dtShort(c.signed_at.slice(0,10)) + '<br>' + esc(c.signer_name || '') : c.viewed_at ? '👁 visto ' + dtShort(c.viewed_at.slice(0,10)) : c.sent_at ? '📨 enviado ' + dtShort(c.sent_at.slice(0,10)) : c.reviewed_at ? '✎ revisado ' + dtShort(c.reviewed_at.slice(0,10)) : '— aguardando revisão'}</td><td><select onchange="sb.from('contracts').update({status:this.value,signed_at:this.value==='signed'?new Date().toISOString():null}).eq('id','${c.id}').then(()=>toast('Status salvo','ok'))">${['draft', 'sent', 'signed', 'ended'].map(s => `<option value="${s}" ${c.status === s ? 'selected' : ''}>${{ draft: 'Rascunho', sent: 'Enviado', signed: 'Assinado', ended: 'Encerrado' }[s]}</option>`).join('')}</select></td><td style="white-space:nowrap"><a class="btn sm ${c.reviewed_at ? 'ghost' : 'primary'}" href="editor.html?contrato=${c.id}" target="_blank">Revisar e editar</a> ${c.status !== 'signed' ? (c.reviewed_at ? `<button class="btn sm primary" onclick="sendContract('${c.id}')">${c.sent_at ? 'Reenviar' : 'Enviar ao cliente'}</button>` : `<button class="btn sm ghost" disabled title="Revise e salve no editor antes de enviar">Enviar</button>`) : ''} ${c.public_token ? `<button class="btn sm ghost" onclick="navigator.clipboard.writeText('${PORTAL.site}/contrato.html?t=${c.public_token}');toast('Link copiado','ok')">Link</button>` : ''} <button class="btn sm ghost" onclick="uploadContractPdf('${c.id}')">PDF</button></td></tr>`).join('') || '<tr><td colspan="8" class="empty">Nenhum contrato.</td></tr>'}</tbody></table>`; }
async function newContract() { if (!CUR || CUR === 'all') return toast('Abra o espaço de uma empresa primeiro', 'bad'); const { data: last } = await sb.from('contracts').select('number').order('number', { ascending: false }).limit(1); const n = 'CTR-' + String((parseInt((last?.[0]?.number || 'CTR-000000').slice(4)) || 0) + 1).padStart(6, '0'); const today = new Date().toISOString().slice(0, 10);
  modal(`<h2>Novo contrato</h2><div class="sub">Marque as frentes contratadas. As faturas são geradas automaticamente pelo dia de vencimento.</div>
  <div class="row2"><label class="f"><span>Empresa</span><select id="k_co" disabled><option value="${CUR}">${esc(coName(CUR))}</option></select></label><label class="f"><span>Número</span><input id="k_number" value="${n}"></label></div>
  <div class="row3"><label class="f"><span>Início</span><input type="date" id="k_start" value="${today}"></label><label class="f"><span>Meses</span><input type="number" id="k_months" value="12"></label><label class="f"><span>Dia do vencimento</span><input type="number" id="k_due" value="10" min="1" max="28"></label></div>
  <div class="row2"><label class="f"><span>Mensalidade (R$)</span><input type="number" step="0.01" id="k_amount"></label><label class="f"><span>Entrada paga no ato (R$, opcional)</span><input type="number" step="0.01" id="k_entry" placeholder="0"></label></div>
  <div class="mono" style="margin-top:16px">Frentes contratadas</div><div class="perms">${CAT.map(s => `<label><input type="checkbox" value="${s.key}"><span>${esc(s.label)}</span></label>`).join('')}</div>
  <div class="md-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveContract()">Criar contrato e faturas</button></div>`, { width: 'min(760px,100%)' }); }
async function saveContract() { const company_id = $('#k_co').value, months = +$('#k_months').value, start = $('#k_start').value, due = +$('#k_due').value, amount = +$('#k_amount').value, entry = +($('#k_entry').value || 0); if (!amount || !start) return toast('Preencha valor e início', 'bad');
  const end = new Date(start + 'T12:00:00'); end.setMonth(end.getMonth() + months); end.setDate(end.getDate() - 1);
  const { data: ct, error } = await sb.from('contracts').insert({ company_id, number: $('#k_number').value, start_date: start, end_date: end.toISOString().slice(0, 10), months, monthly_amount: amount, due_day: due, status: 'draft' }).select().single(); if (error) return toast(error.message, 'bad');
  const keys = $$('#modal .perms input:checked').map(i => i.value); if (keys.length) await sb.from('contract_services').insert(keys.map(k => ({ contract_id: ct.id, service_key: k })));
  const { data: lastInv } = await sb.from('invoices').select('number').order('number', { ascending: false }).limit(1); let seq = parseInt(lastInv?.[0]?.number || '001000') || 1000; const rows = []; const s = new Date(start + 'T12:00:00');
  for (let i = 0; i < months; i++) { const comp = new Date(s.getFullYear(), s.getMonth() + i, 1); const dueD = new Date(s.getFullYear(), s.getMonth() + i, due); if (i === 0 && dueD < s) dueD.setTime(s.getTime());

async function readDrop(dtf) { const out = []; const items = [...(dtf.items || [])]; const walk = async (entry, prefix) => { if (entry.isFile) { const f = await new Promise(r => entry.file(r)); out.push({ file: f, rel: prefix + f.name }); } else if (entry.isDirectory) { const rd = entry.createReader(); let batch; do { batch = await new Promise(r => rd.readEntries(r)); for (const e of batch) await walk(e, prefix + entry.name + '/'); } while (batch.length); } };
  if (items.length && items[0].webkitGetAsEntry) { for (const it of items) { const en = it.webkitGetAsEntry(); if (en) await walk(en, ''); } } else [...dtf.files].forEach(f => out.push({ file: f, rel: f.name })); return out; }
async function uploadCreatives(list) { if (!list.length) return; const kind = $('#upKind').value, status = $('#upStatus').value, folderIn = $('#upFolder').value.trim(); const ul = $('#uplist'); let ok = 0;

    const mime = file.type || (/(mp4|mov|webm)$/i.test(file.name) ? 'video/mp4' : /(png|jpe?g|webp|gif)$/i.test(file.name) ? 'image/' + file.name.split('.').pop() : 'application/octet-stream');
    const autoKind = kind !== 'other' ? kind : mime.startsWith('video/') ? 'video' : mime.startsWith('image/') ? 'post' : 'other';
    const { error } = await sb.from('creatives').insert({ company_id: CUR, title: file.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' '), kind: autoKind, storage_path: path, mime, size_bytes: file.size, status, folder, month: new Date().toISOString().slice(0, 8) + '01', created_by: ME.user_id }); line.lastChild.textContent = error ? 'erro: ' + error.message : 'ok'; if (!error) ok++; }

function requestRows(data) { return `<table><thead><tr><th>Empresa</th><th>Pedido</th><th>Quem</th><th>Aberto</th><th>Prazo</th><th>Status</th></tr></thead><tbody>${(data || []).map(r => `<tr><td>${esc(coName(r.company_id))}</td><td><b>${esc(r.title)}</b><br><small style="color:var(--muted)">${esc(r.category || '')} · ${esc(r.description || '')}</small></td><td>${esc(r.profiles?.full_name || '')}</td><td>${dtShort(r.created_at.slice(0, 10))}</td><td><input type="date" value="${r.due_date || ''}" style="width:150px" onchange="sb.from('requests').update({due_date:this.value||null}).eq('id','${r.id}').then(()=>toast('Prazo salvo','ok'))"></td><td><select style="width:auto" onchange="sb.from('requests').update({status:this.value}).eq('id','${r.id}').then(()=>toast('Status salvo','ok'))">${['open', 'in_progress', 'done'].map(s => `<option value="${s}" ${r.status === s ? 'selected' : ''}>${{ open: 'Aberta', in_progress: 'Em andamento', done: 'Concluída' }[s]}</option>`).join('')}</select></td></tr>`).join('') || '<tr><td colspan="6" class="empty">Nenhuma solicitação.</td></tr>'}</tbody></table>`; }

/* ===== MÉTRICAS (conector manual) ===== */
async function metricas() { const { data } = await sb.from('metrics_daily').select('*').eq('company_id', CUR).order('date', { ascending: false }).limit(60);
  const METRICS = { instagram: ['followers', 'reach', 'impressions', 'profile_views', 'engagement'], facebook: ['followers', 'reach'], tiktok: ['followers', 'views'], meta_ads: ['spend', 'impressions', 'clicks', 'leads', 'sales'], google_ads: ['spend', 'impressions', 'clicks', 'leads', 'sales'], tiktok_ads: ['spend', 'impressions', 'clicks', 'leads'], openai_ads: ['spend', 'impressions', 'clicks', 'leads'], manual: ['leads', 'sales', 'spend'] };
  OUT.innerHTML = wsHead('Lance os números do período (ou importe CSV). As integrações automáticas substituem isso depois sem mudar o painel.') + `<div class="grid2"><div class="card"><h3>Lançar</h3><div class="row2"><label class="f"><span>Fonte</span><select id="mt_s" onchange="$('#mt_m').innerHTML=(${JSON.stringify(METRICS)})[this.value].map(m=>'<option>'+m+'</option>').join('')">${Object.keys(METRICS).map(s => `<option>${s}</option>`).join('')}</select></label><label class="f"><span>Métrica</span><select id="mt_m">${METRICS.instagram.map(m => `<option>${m}</option>`).join('')}</select></label></div><div class="row2"><label class="f"><span>Data</span><input type="date" id="mt_d" value="${new Date().toISOString().slice(0, 10)}"></label><label class="f"><span>Valor</span><input type="number" step="0.01" id="mt_v"></label></div><p class="hint">followers = total no dia. reach, impressions, clicks, leads, spend, sales = valor do dia (ou do mês, lançado no último dia).</p><button class="btn primary" style="margin-top:10px" onclick="saveMetric()">Salvar</button>
  <h3 style="margin-top:22px">Importar CSV</h3><p class="hint">Colunas: source,metric,date,value (data AAAA-MM-DD).</p><input type="file" id="mt_csv" accept=".csv" style="margin-top:8px"></div>
  <div class="card"><h3>Últimos lançamentos</h3><table><thead><tr><th>Data</th><th>Fonte</th><th>Métrica</th><th>Valor</th><th></th></tr></thead><tbody>${(data || []).map(m => `<tr><td>${dtShort(m.date)}</td><td>${m.source}</td><td>${m.metric}</td><td>${num(m.value, 2)}</td><td><button class="btn sm ghost" onclick="sb.from('metrics_daily').delete().eq('id',${m.id}).then(route)">×</button></td></tr>`).join('') || '<tr><td colspan="5" class="empty">Nada lançado.</td></tr>'}</tbody></table></div></div>`;
  $('#mt_csv').onchange = async e => { const t = await e.target.files[0].text(); const rows = t.trim().split(/\r?\n/).slice(1).map(l => l.split(',')).filter(r => r.length >= 4).map(r => ({ company_id: CUR, source: r[0].trim(), metric: r[1].trim(), date: r[2].trim(), value: +r[3] })); const { error } = await sb.from('metrics_daily').upsert(rows, { onConflict: 'company_id,source,metric,date' }); toast(error ? error.message : rows.length + ' linhas importadas', error ? 'bad' : 'ok'); route(); }; }
async function saveMetric() { const { error } = await sb.from('metrics_daily').upsert({ company_id: CUR, source: $('#mt_s').value, metric: $('#mt_m').value, date: $('#mt_d').value, value: +$('#mt_v').value }, { onConflict: 'company_id,source,metric,date' }); toast(error ? error.message : 'Salvo', error ? 'bad' : 'ok'); if (!error) route(); }

/* ===== NPS ===== */
async function nps() { const [{ data: r }, { data: oc }] = await Promise.all([sb.from('nps_responses').select('*, profiles:user_id(full_name)').order('created_at', { ascending: false }), sb.from('offer_clicks').select('*').order('created_at', { ascending: false })]); const sc = (r || []).map(x => x.score); const prom = sc.filter(s => s >= 9).length, det = sc.filter(s => s <= 6).length; const npsv = sc.length ? Math.round((prom - det) / sc.length * 100) : null;
  OUT.innerHTML = head('NPS e oportunidades', 'Respostas das pesquisas e cliques em "Quero contratar".') + `<div class="grid3"><div class="stat"><small>NPS geral</small><b>${npsv ?? '–'}</b><small>${sc.length} respostas</small></div><div class="stat"><small>Promotores</small><b style="color:var(--ok)">${prom}</b></div><div class="stat"><small>Detratores</small><b style="color:var(--bad)">${det}</b></div></div>
  <div class="grid2" style="margin-top:14px"><div class="card"><h3>Respostas</h3>${(r || []).map(x => `<div class="kv"><span><b>${x.score}</b> · ${esc(coName(x.company_id))} · ${esc(x.profiles?.full_name || '')}<br><small style="color:var(--muted)">${esc(x.comment || '')}</small></span><b>${dtShort(x.created_at.slice(0, 10))}</b></div>`).join('') || '<div class="empty">Sem respostas ainda.</div>'}</div><div class="card"><h3>Oportunidades</h3>${(oc || []).map(o => `<div class="kv"><span>${esc(coName(o.company_id))} · ${esc(CAT.find(s => s.key === o.service_key)?.label || o.service_key)}</span><b>${dtShort(o.created_at.slice(0, 10))}</b></div>`).join('') || '<div class="empty">Nenhum clique ainda.</div>'}</div></div>`; }

/* ===== USUÁRIOS E CONVITES ===== */
async function usuarios() { const [{ data: roles }, { data: tk }] = await Promise.all([sb.from('user_roles').select('*, profiles:user_id(full_name,email)').order('created_at', { ascending: false }), sb.from('onboarding_tokens').select('*').order('created_at', { ascending: false }).limit(50)]);
  OUT.innerHTML = head('Usuários e convites', 'Gere o link público de cadastro: o cliente entra, preenche a empresa e cria a senha (ou usa Google).', `<button class="btn primary" onclick="newInvite()">+ Gerar link de acesso</button>`) + `<div class="grid2"><div class="card"><h3>Usuários <a class="btn sm ghost" style="margin-left:auto" onclick="openCompany('${c.id}','usuarios')">gerenciar</a></h3>${(roles || []).map(r => `<div class="mem"><div class="avatar" style="width:34px;height:34px;font-size:12px">${initials(r.profiles?.full_name || r.profiles?.email)}</div><div><b>${esc(r.profiles?.full_name || r.profiles?.email || '')}</b><p>${esc(r.profiles?.email || '')} · ${r.company_id ? esc(coName(r.company_id)) : 'Sistema'}</p></div><span class="badge ${r.role === 'super_admin' ? 'gold' : r.role === 'company_admin' ? 'ok' : ''}">${{ super_admin: 'Super admin', company_admin: 'Admin', company_manager: 'Gerente' }[r.role]}</span></div>`).join('')}</div>
  <div class="card"><h3>Links gerados</h3>${(tk || []).map(t => `<div class="kv"><span><b>${t.company_id ? esc(coName(t.company_id)) : 'Cadastro de nova empresa'}</b> · ${t.role === 'company_admin' ? 'Admin' : 'Gerente'}${t.email ? ' · ' + esc(t.email) : ''}<br><small style="color:var(--hud)">${t.used_at ? 'usado em ' + dtShort(t.used_at.slice(0, 10)) : t.expires_at < new Date().toISOString() ? 'expirado' : 'válido até ' + dtShort(t.expires_at.slice(0, 10))}</small></span><b>${!t.used_at ? `<button class="btn sm ghost" onclick="navigator.clipboard.writeText('${PORTAL.site}/entrar.html?token=${t.token}');toast('Link copiado','ok')">Copiar</button>` : ''}</b></div>`).join('') || '<div class="empty">Nenhum link ainda.</div>'}</div></div>`; }
function newInvite(pre) { modal(`<h2>Gerar link de acesso</h2><div class="sub">Para empresa já cadastrada, o link entra direto nela. Sem empresa, o cliente cadastra a dele no primeiro acesso.</div><label class="f"><span>Empresa</span><select id="iv_co"><option value="">Nova empresa (cliente cadastra)</option>${COS.map(c => `<option value="${c.id}" ${c.id === pre ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label><div class="row2"><label class="f"><span>Nome (opcional)</span><input id="iv_n"></label><label class="f"><span>E-mail (opcional)</span><input id="iv_e"></label></div><div class="roles"><label class="on"><input type="radio" name="iv_r" value="company_admin" checked><b>Admin da empresa</b><span>vê tudo e convida a equipe</span></label><label><input type="radio" name="iv_r" value="company_manager"><b>Gerente</b><span>vê só o que for marcado</span></label></div><div class="md-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveInvite()">Gerar link</button></div>`); $$('#modal .roles label').forEach(l => l.onclick = () => { $$('#modal .roles label').forEach(x => x.classList.remove('on')); l.classList.add('on'); }); }
async function saveInvite() { const { data, error } = await sb.from('onboarding_tokens').insert({ company_id: $('#iv_co').value || null, role: $('#modal input[name=iv_r]:checked').value, email: $('#iv_e').value || null, full_name: $('#iv_n').value || null, invited_by: ME.user_id }).select().single(); if (error) return toast(error.message, 'bad'); const link = `${PORTAL.site}/entrar.html?token=${data.token}`; navigator.clipboard.writeText(link).catch(() => {}); modal(`<h2>Link pronto</h2><div class="sub">Vale por 7 dias e só uma vez.</div><div class="copybox">${link}</div><div class="md-actions"><a class="btn wa" target="_blank" href="https://wa.me/?text=${encodeURIComponent('Seu acesso ao painel Ben Hur Andrade: ' + link)}">Enviar por WhatsApp</a><button class="btn primary" onclick="closeModal();route()">Pronto</button></div>`); }

/* ===== AUTOMAÇÕES ===== */
async function automacoes() { const [{ data }, { data: st }, { data: runs }] = await Promise.all([sb.from('automations').select('*').order('created_at'), sb.from('settings').select('*'), sb.from('automation_runs').select('*, automations(name)').order('id', { ascending: false }).limit(30)]); const S = Object.fromEntries((st || []).map(x => [x.key, x.value]));
  OUT.innerHTML = head('Automações e mensageria', 'Gatilhos e mensagens. A fila roda a cada minuto dentro do banco.', `<button class="btn primary" onclick="editAuto()">+ Automação</button>`) + `<div class="card" style="margin-bottom:14px"><h3>Z-API (WhatsApp)</h3><div class="row3"><label class="f"><span>ID da instância</span><input id="z_i" value="${esc(S.zapi_instance || '')}"></label><label class="f"><span>Token da instância</span><input id="z_t" value="${esc(S.zapi_token || '')}"></label><label class="f"><span>Client-Token (segurança)</span><input id="z_c" value="${esc(S.zapi_client_token || '')}"></label></div><div class="toolbar" style="margin-top:12px"><button class="btn primary sm" onclick="saveZapi()">Salvar</button><button class="btn ghost sm" onclick="testZapi()">Enviar teste pro meu WhatsApp</button><span class="hint" style="margin:0">Status: ${S.zapi_instance && S.zapi_token ? '<span class="badge ok">configurada</span>' : '<span class="badge warn">não configurada · mensagens ficam em espera</span>'}</span></div></div><div class="card"><table><thead><tr><th>Ativa</th><th>Nome</th><th>Gatilho</th><th>Ação</th><th>Mensagem / config</th><th></th></tr></thead><tbody>${(data || []).map(a => `<tr><td><input type="checkbox" ${a.active ? 'checked' : ''} onchange="sb.from('automations').update({active:this.checked}).eq('id','${a.id}').then(()=>toast('Salvo','ok'))"></td><td><b>${esc(a.name)}</b></td><td><code>${esc(a.trigger)}</code></td><td>${a.action_type}</td><td style="max-width:360px;color:var(--muted);font-size:13px">${esc(a.template || JSON.stringify(a.config))}</td><td><button class="btn sm ghost" onclick="editAuto('${a.id}')">Editar</button></td></tr>`).join('')}</tbody></table></div><div class="card" style="margin-top:14px"><h3>Fila de envios (últimos 30)</h3><table><thead><tr><th>Quando</th><th>Automação</th><th>Empresa</th><th>Telefone</th><th>Status</th><th>Retorno</th></tr></thead><tbody>${(runs || []).map(r => `<tr><td>${dtShort(r.created_at.slice(0,10))} ${r.created_at.slice(11,16)}</td><td>${esc(r.automations?.name || '')}</td><td>${r.company_id ? esc(coName(r.company_id)) : '–'}</td><td>${esc(r.payload?.phone || '')}</td><td><span class="badge ${{ sent: 'ok', done: 'ok', error: 'bad', waiting: 'warn', queued: '' }[r.status] || ''}">${r.status}</span></td><td style="font-size:12px;color:var(--muted)">${esc(r.response || '')}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">Nada na fila.</td></tr>'}</tbody></table></div><p class="hint">Gatilhos disponíveis: contract_sent, contract_viewed, otp, contract_signed, company_first_login, invoice_due_5d, invoice_overdue, contract_30d, * (todos, para webhook). Sem automação para criativos: o cliente vê pelo sino do painel. Gatilhos antigos: company_first_login, invoice_due_5d, invoice_overdue, contract_30d, contract_90d, creative_pending, request_answered, report_ready, * (todos, para webhook). Variáveis: {{nome}}, {{empresa}}, {{valor}}, {{vencimento}}, {{dias}}, {{pix}}, {{link}}, {{titulo}}.</p>`; window._autos = data || []; }
async function saveZapi() { const rows = [['zapi_instance', $('#z_i').value.trim()], ['zapi_token', $('#z_t').value.trim()], ['zapi_client_token', $('#z_c').value.trim()]].map(([key, value]) => ({ key, value, updated_at: new Date().toISOString() })); const { error } = await sb.from('settings').upsert(rows); toast(error ? error.message : 'Z-API salva', error ? 'bad' : 'ok'); if (!error) route(); }
async function testZapi() { const { data: st } = await sb.from('settings').select('*'); const S = Object.fromEntries((st || []).map(x => [x.key, x.value])); const { data: a } = await sb.from('automations').select('id').eq('trigger', 'otp').limit(1); if (!a?.length) return toast('Automação "otp" não existe', 'bad'); const { error } = await sb.from('automation_runs').insert({ automation_id: a[0].id, payload: { phone: S.admin_whatsapp, message: 'Teste do painel Ben Hur Andrade: Z-API funcionando.' }, status: 'queued' }); toast(error ? error.message : 'Teste na fila, chega em até 1 minuto', error ? 'bad' : 'ok'); }
function editAuto(id) { const a = (window._autos || []).find(x => x.id === id) || { action_type: 'whatsapp', config: {}, active: true }; modal(`<h2>${id ? 'Editar' : 'Nova'} automação</h2><div class="row2"><label class="f"><span>Nome</span><input id="a_n" value="${esc(a.name || '')}"></label><label class="f"><span>Gatilho</span><input id="a_t" value="${esc(a.trigger || '')}" placeholder="invoice_due_5d"></label></div><div class="row2"><label class="f"><span>Ação</span><select id="a_a">${['whatsapp', 'email', 'notification', 'webhook'].map(s => `<option ${a.action_type === s ? 'selected' : ''}>${s}</option>`).join('')}</select></label><label class="f"><span>Atraso (minutos)</span><input type="number" id="a_d" value="${a.delay_minutes || 0}"></label></div><label class="f"><span>Mensagem (template)</span><textarea id="a_m">${esc(a.template || '')}</textarea></label><label class="f"><span>Config JSON (url do webhook, instância Z-API...)</span><textarea id="a_c">${esc(JSON.stringify(a.config || {}, null, 1))}</textarea></label><div class="md-actions">${id ? `<button class="btn danger" onclick="sb.from('automations').delete().eq('id','${id}').then(()=>{closeModal();route()})">Excluir</button>` : ''}<button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveAuto('${id || ''}')">Salvar</button></div>`); }
async function saveAuto(id) { let cfg; try { cfg = JSON.parse($('#a_c').value || '{}'); } catch { return toast('Config JSON inválido', 'bad'); } const row = { name: $('#a_n').value, trigger: $('#a_t').value, action_type: $('#a_a').value, delay_minutes: +$('#a_d').value, template: $('#a_m').value, config: cfg }; const r = id ? await sb.from('automations').update(row).eq('id', id) : await sb.from('automations').insert(row); if (r.error) return toast(r.error.message, 'bad'); closeModal(); route(); }

/* ===== CATÁLOGO ===== */
async function catalogo() { OUT.innerHTML = head('Catálogo e valores', 'Frentes de serviço, valor "a partir de" e parcelas mostradas ao cliente.', `<button class="btn primary" onclick="editService()">+ Serviço</button>`) + `<div class="card"><table><thead><tr><th>Ativo</th><th>Serviço</th><th>Categoria</th><th>A partir de</th><th>Tipo</th><th>Parcelas</th><th></th></tr></thead><tbody>${CAT.map(s => `<tr><td><input type="checkbox" ${s.active ? 'checked' : ''} onchange="sb.from('services_catalog').update({active:this.checked}).eq('key','${s.key}').then(()=>toast('Salvo','ok'))"></td><td><b>${esc(s.label)}</b><br><small style="color:var(--muted)">${esc(s.description || '')}</small></td><td>${esc(s.category || '')}</td><td>${money(s.price_from)}</td><td>${s.price_type === 'monthly' ? 'mensal' : 'único'}</td><td>${s.installments}x</td><td><button class="btn sm ghost" onclick="editService('${s.key}')">Editar</button></td></tr>`).join('')}</tbody></table></div>`; }
function editService(key) { const s = CAT.find(x => x.key === key) || { installments: 3, price_type: 'monthly', active: true }; modal(`<h2>${key ? 'Editar' : 'Novo'} serviço</h2><div class="row2"><label class="f"><span>Chave (sem espaços)</span><input id="s_k" value="${esc(s.key || '')}" ${key ? 'disabled' : ''}></label><label class="f"><span>Nome</span><input id="s_l" value="${esc(s.label || '')}"></label></div><div class="row3"><label class="f"><span>Categoria</span><select id="s_c">${['trafego', 'social', 'design', 'web', 'estrategia', 'comercial', 'marca', 'copy', 'video'].map(c => `<option ${s.category === c ? 'selected' : ''}>${c}</option>`).join('')}</select></label><label class="f"><span>Valor a partir de</span><input type="number" step="0.01" id="s_p" value="${s.price_from || ''}"></label><label class="f"><span>Parcelas</span><input type="number" id="s_i" value="${s.installments}"></label></div><div class="row2"><label class="f"><span>Tipo</span><select id="s_t"><option value="monthly" ${s.price_type === 'monthly' ? 'selected' : ''}>mensal</option><option value="one_time" ${s.price_type === 'one_time' ? 'selected' : ''}>único</option></select></label><label class="f"><span>Ordem</span><input type="number" id="s_o" value="${s.sort || 0}"></label></div><label class="f"><span>Descrição (aparece no card)</span><textarea id="s_d">${esc(s.description || '')}</textarea></label><div class="md-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveService('${key || ''}')">Salvar</button></div>`); }
async function saveService(key) { const row = { key: key || slug($('#s_k').value).toLowerCase(), label: $('#s_l').value, category: $('#s_c').value, price_from: +$('#s_p').value, installments: +$('#s_i').value, price_type: $('#s_t').value, sort: +$('#s_o').value, description: $('#s_d').value }; const { error } = await sb.from('services_catalog').upsert(row); if (error) return toast(error.message, 'bad'); closeModal(); await refreshBase(); route(); }
boot();
</script></body></html>
