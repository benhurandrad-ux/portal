<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · Painel</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css?v=6">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js?v=6"></script><script src="core.js?v=6"></script></head>
<body><div class="auth"><form class="card" id="f">
  <div class="brand"><div class="mark"></div><b>BEN HUR ANDRADE</b></div>
  <h1>Entrar no painel</h1><p class="sub">Acompanhe os resultados, criativos e o andamento do seu projeto.</p>
  <label class="f"><span>E-mail</span><input type="email" id="email" autocomplete="email" required></label>
  <label class="f"><span>Senha</span><input type="password" id="pwd" autocomplete="current-password" required></label>
  <div class="err" id="err"></div>
  <button class="btn primary" type="submit">Entrar</button>
  <div class="or">ou</div>
  <button class="btn ghost" type="button" id="google"><svg class="g" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.7-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.1 0-5.8-2.1-6.7-5H1.3v3.1C3.3 21.3 7.3 24 12 24z"/><path fill="#FBBC05" d="M5.3 14.3c-.5-1.5-.5-3.1 0-4.6V6.6H1.3c-1.7 3.4-1.7 7.4 0 10.8l4-3.1z"/><path fill="#EA4335" d="M12 4.7c1.7 0 3.3.6 4.5 1.8l3.4-3.4C17.9 1.2 15.1 0 12 0 7.3 0 3.3 2.7 1.3 6.6l4 3.1c.9-2.9 3.6-5 6.7-5z"/></svg>Entrar com Google</button>
  <div class="links"><a href="#" id="forgot">Esqueci minha senha</a><a href="entrar.html">Tenho um convite</a></div>
</form></div>
<script>
const next = new URLSearchParams(location.search).get('next') || 'index.html';
sb.auth.getSession().then(({data:{session}}) => { if (session) location.replace(next); });
$('#f').addEventListener('submit', async e => { e.preventDefault(); $('#err').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#pwd').value });
  if (error) { $('#err').textContent = /Invalid login/i.test(error.message) ? 'E-mail ou senha incorretos.' : error.message; return; }
  location.replace(next); });
$('#google').addEventListener('click', async () => { const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname.replace('login.html','') + next } }); if (error) $('#err').textContent = error.message; });
$('#forgot').addEventListener('click', async e => { e.preventDefault(); const email = $('#email').value.trim(); if (!email) { $('#err').textContent = 'Digite seu e-mail primeiro.'; return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname.replace('login.html','') + 'primeiro-acesso.html?mode=recovery' });
  $('#err').textContent = error ? error.message : ''; if (!error) toast('Enviamos um link para ' + email, 'ok'); });
</script></body></html>
