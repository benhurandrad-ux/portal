<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fatura · Ben Hur Andrade</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="fatura.css?v=23">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script><script src="config.js?v=23"></script><script src="fatura.js?v=23"></script>
<style>body{margin:0;background:#2a2926;font-family:Poppins,sans-serif;padding:24px 12px 90px}.wrapf{width:794px;margin:0 auto;box-shadow:0 20px 60px rgba(0,0,0,.45);transform-origin:top center}
.act{position:fixed;right:20px;bottom:20px;display:flex;gap:10px}.act button{border:0;border-radius:10px;padding:12px 18px;font:600 14px Poppins;cursor:pointer;background:#D9B45B;color:#141006}.act button.g{background:#fff;color:#1c1b18}
@media print{body{background:#fff;padding:0}.wrapf{box-shadow:none;transform:none!important}.act{display:none}@page{size:A4;margin:0}}</style></head>
<body><div class="wrapf" id="w">Carregando fatura...</div><div class="act"><button class="g" onclick="print()">Imprimir</button><button id="dl" onclick="dl()">Baixar PDF</button></div>
<script>
const sb = supabase.createClient(PORTAL.url, PORTAL.anonKey); const T = new URLSearchParams(location.search).get('t'); let R = null;
function fit() { const w = document.getElementById('w'); const s = Math.min(1, (innerWidth - 24) / 794); w.style.transform = `scale(${s})`; w.style.marginBottom = `-${(1 - s) * w.offsetHeight}px`; }
(async () => { const { data } = await sb.rpc('invoice_public', { p_token: T }); if (!data) { document.getElementById('w').innerHTML = '<p style="padding:40px;background:#fff">Fatura não encontrada.</p>'; return; } R = data; document.title = 'Fatura ' + data.number; document.getElementById('w').innerHTML = faturaHTML(data); fit(); addEventListener('resize', fit); })();
async function dl() { const b = document.getElementById('dl'); b.disabled = true; b.textContent = 'Gerando...'; try { saveBlob(await faturaBlob(R), faturaNome(R)); } finally { b.disabled = false; b.textContent = 'Baixar PDF'; } }
</script></body></html>
