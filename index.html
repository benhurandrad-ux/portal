<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel do Cliente</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script><script src="core.js"></script></head>
<body>
<nav class="nav" id="nav">
  <div class="brand"><div class="mark"></div><b>BEN HUR ANDRADE</b><span class="co" id="coName"></span></div>
  <div class="tabs" id="tabs"></div>
  <div class="right"><div class="bell" id="bell">🔔<i class="hidden" id="bellDot"></i></div><div class="avatar" id="avatarBtn" title="Meu perfil">?</div></div>
</nav>
<main id="view"><div class="empty" style="padding-top:40vh">Carregando seu painel...</div></main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>
<script>
let ME, CO, CTX = {};
const TABS = [['inicio','Início','overview'],['resultados','Resultados','results_social|results_ads|leads'],['criativos','Criativos','creatives_view'],['evolucao','Evolução','roadmap'],['financeiro','Financeiro','financial'],['solicitacoes','Solicitações','requests'],['documentos','Documentos','documents']];
const can = m => ME.is_super_admin || m.split('|').some(k => CO.modules.includes(k));
const view = $('#view');

async function boot() {
  const r = await requireSession(); if (!r) return; ME = r.me;
  const savedCo = localStorage.getItem('portal_company');
  if (ME.is_super_admin && !ME.companies.length) { // Ben visualizando uma empresa
    const { data: cos } = await sb.from('companies').select('id,name,logo_url').order('name');
    ME.companies = (cos || []).map(c => ({ ...c, role: 'super_admin', modules: MODULES.map(m => m[0]) }));
    if (!ME.companies.length) { view.innerHTML = '<div class="empty" style="padding-top:30vh"><b>Nenhuma empresa ainda</b>Crie a primeira no admin.</div>'; return; }
  }
  CO = ME.companies.find(c => c.id === savedCo) || ME.companies[0];
  const { data: co } = await sb.from('companies').select('*').eq('id', CO.id).single(); Object.assign(CO, co || {});
  $('#coName').innerHTML = (CO.logo_url ? `<img src="${esc(publicUrl('logos', CO.logo_url))}" alt="">` : '') + esc(CO.name);
  const name = ME.profile?.full_name || r.session.user.email; $('#avatarBtn').textContent = initials(name);
  $('#tabs').innerHTML = TABS.filter(t => can(t[2])).map(t => `<a data-r="${t[0]}">${t[1]}</a>`).join('');
  $('#tabs').addEventListener('click', e => { const a = e.target.closest('a'); if (a) location.hash = a.dataset.r; });
  addEventListener('hashchange', route); route();
  addEventListener('scroll', () => $('#nav').classList.toggle('solid', scrollY > 40), { passive: true });
  $('#avatarBtn').addEventListener('click', openProfile); $('#scrim').addEventListener('click', closeDrawer);
  loadNotifications();
}
function route() { const r = (location.hash || '#inicio').slice(1); $$('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.r === r)); ({ inicio: home, resultados: results, criativos: creatives, evolucao: roadmap, financeiro: financial, solicitacoes: requests, documentos: documents }[r] || home)(); window.scrollTo(0, 0); }
function openDrawer(html) { $('#drawer').innerHTML = html; $('#drawer').classList.add('on'); $('#scrim').classList.add('on'); }
function closeDrawer() { $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); }

/* ===== dados ===== */
async function loadCore() {
  const since = new Date(); since.setMonth(since.getMonth() - 1); since.setDate(1);
  const [ct, inv, cr, rm, mt, off] = await Promise.all([
    can('financial') ? sb.from('contracts').select('*, contract_services(service_key)').eq('company_id', CO.id).order('created_at', { ascending: false }).limit(1) : { data: [] },
    can('financial') ? sb.from('invoices').select('*').eq('company_id', CO.id).order('due_date') : { data: [] },
    can('creatives_view') ? sb.from('creatives').select('*').eq('company_id', CO.id).order('created_at', { ascending: false }).limit(60) : { data: [] },
    can('roadmap') ? sb.from('roadmap_phases').select('*, roadmap_milestones(*)').eq('company_id', CO.id).order('sort') : { data: [] },
    can('results_social|results_ads') ? sb.from('metrics_daily').select('source,metric,date,value').eq('company_id', CO.id).order('date') : { data: [] },
    sb.from('services_catalog').select('*').eq('active', true).order('sort')
  ]);
  CTX = { contract: ct.data?.[0] || null, invoices: inv.data || [], creatives: cr.data || [], phases: rm.data || [], metrics: mt.data || [], catalog: off.data || [] };
  CTX.contracted = new Set((CTX.contract?.contract_services || []).map(s => s.service_key));
  CTX.thumbs = await signedUrls('creatives', CTX.creatives.map(c => c.thumb_path || c.storage_path));
  return CTX;
}
function agg(source, metric, from, to) { return CTX.metrics.filter(m => (!source || m.source === source) && m.metric === metric && (!from || m.date >= from) && (!to || m.date <= to)).reduce((s, m) => s + Number(m.value), 0); }
function last(source, metric) { const r = CTX.metrics.filter(m => (!source || m.source === source) && m.metric === metric); return r.length ? Number(r[r.length - 1].value) : 0; }
function monthRange(off = 0) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + off); const a = d.toISOString().slice(0, 10); const e = new Date(d.getFullYear(), d.getMonth() + 1, 0).toISOString().slice(0, 10); return [a, e]; }
const delta = (cur, prev) => prev ? `<div class="d ${cur >= prev ? 'up' : 'down'}">${cur >= prev ? '▲' : '▼'} ${num(Math.abs((cur - prev) / prev * 100), 0)}% <span style="color:var(--muted)">vs mês anterior</span></div>` : `<div class="d">sem base de comparação</div>`;

/* ===== INÍCIO ===== */
async function home() {
  await loadCore();
  const start = CTX.contract?.start_date; const days = start ? Math.max(1, Math.floor((new Date() - new Date(start + 'T12:00:00')) / 864e5)) : null;
  const sales = agg(null, 'sales', start), leads = agg(null, 'leads', start), followers = last('instagram', 'followers') - (CTX.metrics.find(m => m.metric === 'followers' && m.date >= (start || '')) ? Number(CTX.metrics.find(m => m.metric === 'followers' && m.date >= (start || '')).value) : 0);
  const delivered = CTX.creatives.filter(c => ['approved', 'published'].includes(c.status)).length;
  const pending = CTX.creatives.filter(c => c.status === 'pending');
  const [m0a, m0b] = monthRange(0), [m1a, m1b] = monthRange(-1);
  const kpis = [
    ['Leads gerados', agg(null, 'leads', m0a, m0b), agg(null, 'leads', m1a, m1b), v => num(v)],
    ['Vendas atribuídas', agg(null, 'sales', m0a, m0b), agg(null, 'sales', m1a, m1b), v => money(v)],
    ['Investimento em mídia', agg(null, 'spend', m0a, m0b), agg(null, 'spend', m1a, m1b), v => money(v)],
    ['Alcance', agg('instagram', 'reach', m0a, m0b), agg('instagram', 'reach', m1a, m1b), v => compact(v)],
    ['Seguidores', last('instagram', 'followers'), 0, v => num(v)]
  ];
  const nextInv = CTX.invoices.filter(i => invoiceStatus(i) !== 'paid' && invoiceStatus(i) !== 'cancelled').sort((a, b) => a.due_date.localeCompare(b.due_date))[0];
  const todos = [];
  if (pending.length && can('creatives_approve')) todos.push(`<div class="todo" onclick="location.hash='criativos'"><div class="ic a">✦</div><div><b>${pending.length} criativo${pending.length > 1 ? 's' : ''} aguardando aprovação</b><p>${esc(pending.slice(0, 2).map(c => c.title).join(', '))}</p></div><span class="go">›</span></div>`);
  if (nextInv && can('financial')) { const d = daysUntil(nextInv.due_date); todos.push(`<div class="todo" onclick="location.hash='financeiro'"><div class="ic ${d < 0 ? 'w' : 'g'}">$</div><div><b>${d < 0 ? 'Mensalidade em atraso' : d <= 5 ? 'Mensalidade vence em ' + d + ' dia' + (d === 1 ? '' : 's') : 'Próxima mensalidade em ' + d + ' dias'}</b><p>${money(nextInv.amount)} · vencimento ${dtShort(nextInv.due_date)} · Pix</p></div><span class="go">›</span></div>`); }
  if (can('nps')) todos.push(`<div class="todo" onclick="openNps()"><div class="ic g">★</div><div><b>Como está sendo o trabalho?</b><p>Pesquisa de 2 minutos · sua opinião muda o plano</p></div><span class="go">›</span></div>`);
  const offers = CTX.catalog.filter(s => !CTX.contracted.has(s.key));
  const hasMetrics = CTX.metrics.length > 0;
  view.innerHTML = `
  <section class="billboard"><div class="art"><div class="glow"></div><div class="grid"></div>
    <svg viewBox="0 0 900 400" preserveAspectRatio="none"><defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9b45b" stop-opacity=".30"/><stop offset="1" stop-color="#d9b45b" stop-opacity="0"/></linearGradient><linearGradient id="stroke" x1="0" x2="1"><stop offset="0" stop-color="#8a6d1f"/><stop offset="1" stop-color="#f3e2a8"/></linearGradient></defs>
      <path id="area" d="M0,330 C80,320 120,300 180,290 S300,270 360,250 S470,220 540,200 S660,150 730,120 S840,60 900,40 L900,400 L0,400Z" fill="url(#fill)" opacity="0"/>
      <path id="line" d="M0,330 C80,320 120,300 180,290 S300,270 360,250 S470,220 540,200 S660,150 730,120 S840,60 900,40" fill="none" stroke="url(#stroke)" stroke-width="3" stroke-linecap="round"/>
      <circle id="dot" cx="900" cy="40" r="6" fill="#fff" opacity="0"><animate attributeName="r" values="6;9;6" dur="2s" repeatCount="indefinite"/></circle></svg></div>
    <div class="bb-copy"><div class="mono">${esc(CO.name)}${start ? ' · desde ' + dt(start) + ' · dia ' + days + ' do projeto' : ''}</div>
      <h1>${esc(CO.name)} não cresce por acaso. <span>Cresce por gestão.</span></h1>
      <p>${hasMetrics ? 'Isso é o que o trabalho já gerou desde o início do projeto. Número do painel, não print bonito.' : 'Seu painel está pronto. Os primeiros números aparecem aqui assim que as campanhas e o conteúdo começarem a rodar.'}</p>
      <div class="bb-actions">${can('creatives_view') ? `<a class="btn primary" onclick="location.hash='criativos'">▶ Ver criativos</a>` : ''}${pending.length && can('creatives_approve') ? `<a class="btn ghost" onclick="location.hash='criativos'">Aprovar criativos <span class="pill">${pending.length}</span></a>` : `<a class="btn ghost" onclick="location.hash='evolucao'">Ver sua jornada</a>`}</div>
      <div class="bb-stats">
        <div><b><small>R$</small> <span data-count="${sales}">0</span></b><span class="mono">Vendas geradas</span></div>
        <div><b data-count="${leads}">0</b><span class="mono">Leads</span></div>
        <div><b data-count="${Math.max(0, followers)}" data-prefix="+">0</b><span class="mono">Seguidores</span></div>
        <div><b data-count="${delivered}">0</b><span class="mono">Criativos entregues</span></div>
      </div></div></section>
  ${can('results_social|results_ads') ? `<section class="row"><div class="row-head"><h2><i></i>Resultados do mês</h2><a class="more" onclick="location.hash='resultados'">Ver tudo ›</a></div><div class="track-wrap"><div class="track">${kpis.map(k => `<div class="kpi"><span class="mono">${k[0]}</span><div class="v">${k[3](k[1])}</div>${k[2] !== 0 || k[1] ? delta(k[1], k[2]) : '<div class="d">em breve</div>'}</div>`).join('')}</div></div></section>` : ''}
  ${todos.length ? `<section class="row"><div class="row-head"><h2><i style="background:var(--warn);color:var(--warn)"></i>Pendências pra você</h2></div><div class="track-wrap"><div class="track">${todos.join('')}</div></div></section>` : ''}
  ${can('creatives_view') ? `<section class="row"><div class="row-head"><h2><i style="background:var(--c-design);color:var(--c-design)"></i>Criativos novos</h2><a class="more" onclick="location.hash='criativos'">Ver todos ›</a></div><div class="track-wrap"><div class="track">${CTX.creatives.length ? CTX.creatives.slice(0, 12).map(posterCard).join('') : '<div class="empty" style="width:100%">Os criativos aparecem aqui assim que forem enviados.</div>'}</div></div></section>` : ''}
  ${can('roadmap') && CTX.phases.length ? `<section class="row"><div class="row-head"><h2><i></i>Sua jornada</h2><a class="more" onclick="location.hash='evolucao'">Ver quadro completo ›</a></div><div class="track-wrap"><div class="track">${CTX.phases.map(phaseCard).join('')}</div></div></section>` : ''}
  ${can('offers') && offers.length ? `<section class="row"><div class="row-head"><h2><i></i>Serviços disponíveis pra você</h2></div><div class="track-wrap"><div class="track">${offers.map(offerCard).join('')}</div></div></section>` : ''}
  <footer style="padding:40px 48px 60px;display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:30px"><span class="mono">Ben Hur Andrade · painel do cliente</span><span class="mono">${hasMetrics ? 'Dados atualizados ' + dt(CTX.metrics[CTX.metrics.length - 1].date) : 'Aguardando primeiros dados'}</span></footer>`;
  animate();
}
function posterCard(c) {
  const url = CTX.thumbs[c.thumb_path || c.storage_path]; const isVideo = (c.mime || '').startsWith('video/'); const isImg = (c.mime || '').startsWith('image/');
  const col = { pending: 'var(--warn)', approved: 'var(--ok)', published: 'var(--ok)', changes: 'var(--bad)', draft: 'var(--muted)' }[c.status];
  return `<div class="poster" onclick="openCreative('${c.id}')">${url && isImg ? `<img src="${url}" alt="">` : url && isVideo ? `<video src="${url}#t=0.5" muted preload="metadata"></video>` : `<div class="file">${isVideo ? '🎬' : '📄'}</div>`}<span class="tag">${KIND_LABEL[c.kind] || 'Arquivo'}</span><i class="status" style="background:${col}"></i>${isVideo ? '<div class="play">▶</div>' : ''}<div class="meta"><b>${esc(c.title)}</b><span>${STATUS_LABEL[c.status]}${c.folder ? ' · ' + esc(c.folder) : ''}</span></div></div>`;
}
function phaseCard(p, i) { return `<div class="ep ${p.status}"><div class="num">${String(p.sort || i + 1).padStart(2, '0')}</div><b>${esc(p.title)}</b><p>${esc(p.description || '')}</p><div class="bar"><i data-w="${p.progress}"></i></div><div class="foot"><span class="mono" style="${p.status === 'current' ? 'color:var(--accent2)' : ''}">${{ done: 'Concluída', current: 'Em andamento · ' + p.progress + '%', next: 'Próxima' }[p.status]}</span><span class="mono">${p.start_date ? dt(p.start_date).slice(3) : ''}</span></div></div>`; }
function offerCard(s) { const parc = Number(s.price_from) / (s.installments || 3); return `<div class="offer"><span class="mono" style="color:${CATEGORY_COLOR[s.category] || 'var(--accent)'}">${esc(s.category || '')}</span><b>${esc(s.label)}</b><p>${esc(s.description || '')}</p><div class="price"><small>até</small>${s.installments || 3}x <span>de ${money(parc)}</span><small>no cartão${s.price_type === 'monthly' ? ' · mês' : ''}</small></div><p class="full">ou ${money(s.price_from)} à vista${s.price_type === 'monthly' ? ' /mês' : ''}</p><a class="wa" target="_blank" href="${waLink(CO.name, s.label)}" onclick="sb.from('offer_clicks').insert({company_id:CO.id,user_id:ME.user_id,service_key:'${s.key}'}).then(()=>{})">Quero contratar</a></div>`; }
function animate() {
  const line = $('#line'), area = $('#area'), dot = $('#dot'); if (line) { const L = line.getTotalLength(); line.style.strokeDasharray = L; line.style.strokeDashoffset = L; line.style.transition = 'stroke-dashoffset 2.2s cubic-bezier(.2,.8,.2,1)'; requestAnimationFrame(() => { line.style.strokeDashoffset = 0; setTimeout(() => { area.style.transition = 'opacity 1s'; area.style.opacity = 1; dot.style.opacity = 1; }, 1200); }); }
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { $$('[data-count]', e.target).forEach(countUp); $$('.bar i', e.target).forEach(b => b.style.width = b.dataset.w + '%'); io.unobserve(e.target); } }), { threshold: .2 });
  $$('section').forEach(s => io.observe(s));
}
function countUp(el) { const end = parseFloat(el.dataset.count) || 0, pre = el.dataset.prefix || '', t0 = performance.now(); (function step(t) { const p = Math.min(1, (t - t0) / 1500), e = 1 - Math.pow(1 - p, 3); el.textContent = pre + num(end * e); if (p < 1) requestAnimationFrame(step); })(t0); }

/* ===== RESULTADOS ===== */
async function results() {
  await loadCore(); const [a, b] = monthRange(0), [pa, pb] = monthRange(-1);
  const groups = [['instagram', 'Instagram', ['followers', 'Seguidores', 'last'], ['reach', 'Alcance', 'sum'], ['impressions', 'Impressões', 'sum'], ['profile_views', 'Visitas ao perfil', 'sum'], ['engagement', 'Engajamento', 'sum']],
    ['meta_ads', 'Meta Ads', ['spend', 'Investimento', 'money'], ['impressions', 'Impressões', 'sum'], ['clicks', 'Cliques', 'sum'], ['leads', 'Leads', 'sum'], ['cpl', 'Custo por lead', 'calc']],
    ['google_ads', 'Google Ads', ['spend', 'Investimento', 'money'], ['impressions', 'Impressões', 'sum'], ['clicks', 'Cliques', 'sum'], ['leads', 'Leads', 'sum'], ['cpl', 'Custo por lead', 'calc']],
    ['tiktok_ads', 'TikTok Ads', ['spend', 'Investimento', 'money'], ['impressions', 'Impressões', 'sum'], ['clicks', 'Cliques', 'sum'], ['leads', 'Leads', 'sum']],
    ['manual', 'Vendas e leads (lançados)', ['leads', 'Leads', 'sum'], ['sales', 'Vendas', 'money']]];
  const has = s => CTX.metrics.some(m => m.source === s);
  view.innerHTML = `<div class="wrap"><div class="page-title">Resultados</div><div class="page-sub">${monthLabel(a)} comparado com ${monthLabel(pa)}.</div>
  ${CTX.metrics.length ? groups.filter(g => has(g[0])).map(g => `<div class="row" style="padding:10px 0"><div class="row-head" style="padding:0"><h2><i style="background:${g[0].includes('ads') ? 'var(--c-ads)' : 'var(--c-social)'};color:inherit"></i>${g[1]}</h2></div><div class="grid4">${g.slice(2).map(([k, l, t]) => { let cur, prev, f = num; if (t === 'last') { cur = last(g[0], k); prev = 0; } else if (t === 'calc') { const sp = agg(g[0], 'spend', a, b), ld = agg(g[0], 'leads', a, b); cur = ld ? sp / ld : 0; const sp2 = agg(g[0], 'spend', pa, pb), ld2 = agg(g[0], 'leads', pa, pb); prev = ld2 ? sp2 / ld2 : 0; f = money; } else { cur = agg(g[0], k, a, b); prev = agg(g[0], k, pa, pb); f = t === 'money' ? money : compact; } return `<div class="kpi" style="width:auto"><span class="mono">${l}</span><div class="v">${f(cur)}</div>${delta(cur, prev)}</div>`; }).join('')}</div></div>`).join('') : `<div class="card empty"><b>Ainda sem números</b>Os resultados de Instagram e tráfego aparecem aqui assim que as contas forem conectadas ou os dados lançados.</div>`}</div>`;
}
/* ===== CRIATIVOS ===== */
async function creatives() {
  await loadCore(); const folders = [...new Set(CTX.creatives.map(c => c.folder || 'Geral'))];
  view.innerHTML = `<div class="wrap"><div class="page-title">Criativos</div><div class="page-sub">Tudo que foi produzido para ${esc(CO.name)}. ${can('creatives_approve') ? 'Clique para aprovar ou pedir ajuste.' : ''}</div>
  ${CTX.creatives.length ? folders.map(f => `<h3 style="margin:22px 0 12px;font-size:16px">${esc(f)}</h3><div class="thumbs">${CTX.creatives.filter(c => (c.folder || 'Geral') === f).map(posterCard).join('')}</div>`).join('') : '<div class="card empty"><b>Nenhum criativo ainda</b>Assim que a equipe enviar, aparece aqui.</div>'}</div>`;
}
async function openCreative(id) {
  const c = CTX.creatives.find(x => x.id === id); const url = await signedUrl('creatives', c.storage_path); const isVideo = (c.mime || '').startsWith('video/'), isImg = (c.mime || '').startsWith('image/');
  const { data: reviews } = await sb.from('creative_reviews').select('*, profiles:user_id(full_name)').eq('creative_id', id).order('created_at');
  modal(`<h2>${esc(c.title)}</h2><div class="sub">${KIND_LABEL[c.kind]} · ${STATUS_LABEL[c.status]}${c.folder ? ' · ' + esc(c.folder) : ''}${c.description ? '<br>' + esc(c.description) : ''}</div>
    <div style="border-radius:12px;overflow:hidden;background:#000;display:grid;place-items:center;max-height:60vh">${isImg ? `<img src="${url}" style="max-width:100%;max-height:60vh">` : isVideo ? `<video src="${url}" controls style="max-width:100%;max-height:60vh"></video>` : `<div class="empty">Arquivo ${esc(c.mime || '')}</div>`}</div>
    ${reviews?.length ? `<div style="margin-top:14px">${reviews.map(r => `<div class="kv"><span>${esc(r.profiles?.full_name || 'Equipe')} · ${{ approve: 'aprovou', changes: 'pediu ajuste', comment: 'comentou' }[r.action]}</span><b style="font-weight:400">${esc(r.comment || '')}</b></div>`).join('')}</div>` : ''}
    ${can('creatives_approve') ? `<label class="f"><span>Comentário (opcional)</span><textarea id="rv"></textarea></label>` : ''}
    <div class="md-actions"><a class="btn ghost" href="${url}" download target="_blank">Baixar</a>${can('creatives_approve') ? `<button class="btn danger" onclick="review('${id}','changes')">Pedir ajuste</button><button class="btn primary" onclick="review('${id}','approve')">Aprovar</button>` : ''}</div>`, { width: 'min(860px,100%)' });
}
async function review(id, action) { const comment = $('#rv')?.value || null; const { error } = await sb.from('creative_reviews').insert({ creative_id: id, user_id: ME.user_id, action, comment }); if (error) return toast(error.message, 'bad');
  toast(action === 'approve' ? 'Criativo aprovado' : 'Ajuste solicitado', 'ok'); closeModal(); route(); }
/* ===== EVOLUÇÃO ===== */
async function roadmap() { await loadCore();
  view.innerHTML = `<div class="wrap"><div class="page-title">Sua jornada</div><div class="page-sub">Fases do projeto e o que já foi entregue.</div>${CTX.phases.length ? CTX.phases.map((p, i) => `<div class="card" style="margin-bottom:12px"><div style="display:flex;gap:18px;align-items:flex-start"><div class="ep ${p.status}" style="width:auto;border:0;padding:0;background:none"><div class="num">${String(p.sort || i + 1).padStart(2, '0')}</div></div><div style="flex:1"><h3 style="margin:0">${esc(p.title)} <span class="badge ${p.status === 'done' ? 'ok' : p.status === 'current' ? 'gold' : ''}">${{ done: 'Concluída', current: p.progress + '%', next: 'Próxima' }[p.status]}</span></h3><p style="color:var(--muted);font-size:14px;margin-top:4px">${esc(p.description || '')}</p><div class="bar"><i style="width:${p.progress}%"></i></div>${(p.roadmap_milestones || []).length ? `<div style="margin-top:12px">${p.roadmap_milestones.sort((a, b) => (a.due_date || '').localeCompare(b.due_date || '')).map(m => `<div class="kv"><span>${m.done ? '✅' : '◻︎'} ${esc(m.title)}</span><b>${m.done ? dt(m.done_at) : m.due_date ? 'até ' + dt(m.due_date) : ''}</b></div>`).join('')}</div>` : ''}</div></div></div>`).join('') : '<div class="card empty"><b>Jornada em preparação</b>As fases do seu projeto aparecem aqui.</div>'}</div>`; }
/* ===== FINANCEIRO ===== */
async function financial() { await loadCore(); const ct = CTX.contract; const next = CTX.invoices.filter(i => ['open', 'overdue'].includes(invoiceStatus(i)))[0];
  view.innerHTML = `<div class="wrap"><div class="page-title">Financeiro e contrato</div><div class="page-sub">Mensalidade, faturas e o que está contratado.</div>
  <div class="grid3">
    <div class="stat"><small>Mensalidade</small><b>${ct ? money(ct.monthly_amount) : '–'}</b><small>${ct ? 'vence todo dia ' + ct.due_day : ''}</small></div>
    <div class="stat"><small>Situação</small><b><span class="badge ${!next ? 'ok' : invoiceStatus(next) === 'overdue' ? 'bad' : daysUntil(next.due_date) <= 5 ? 'warn' : 'ok'}" style="font-size:16px">${!next ? 'Em dia' : invoiceStatus(next) === 'overdue' ? 'Em atraso' : daysUntil(next.due_date) <= 5 ? 'Vence em ' + daysUntil(next.due_date) + ' dias' : 'Em dia'}</span></b><small>${next ? 'próximo vencimento ' + dtShort(next.due_date) : 'nenhuma fatura pendente'}</small></div>
    <div class="stat"><small>Contrato</small><b style="font-size:18px">${ct ? esc(ct.number) : '–'}</b><small>${ct ? dtShort(ct.start_date) + ' a ' + dtShort(ct.end_date) : ''}</small></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>Faturas</h3><table><thead><tr><th>Nº</th><th>Competência</th><th>Vencimento</th><th>Valor</th><th>Situação</th><th></th></tr></thead><tbody>${CTX.invoices.map(i => { const s = invoiceStatus(i); return `<tr><td>${esc(i.number)}</td><td>${monthLabel(i.competence)}</td><td>${dtShort(i.due_date)}</td><td>${money(i.amount)}</td><td><span class="badge ${{ paid: 'ok', open: '', overdue: 'bad', cancelled: '' }[s]}">${INVOICE_LABEL[s]}${s === 'paid' && i.paid_at ? ' · ' + dtShort(i.paid_at.slice(0, 10)) : ''}</span></td><td>${s !== 'paid' && i.pix_key ? `<button class="btn sm ghost" onclick="navigator.clipboard.writeText('${esc(i.pix_key)}');toast('Chave Pix copiada','ok')">Copiar Pix</button>` : ''}</td></tr>`; }).join('') || '<tr><td colspan="6" class="empty">Sem faturas.</td></tr>'}</tbody></table></div>
  ${ct ? `<div class="card" style="margin-top:14px"><h3>O que está contratado</h3><div class="chips">${[...CTX.contracted].map(k => `<span>${esc(CTX.catalog.find(s => s.key === k)?.label || k)}</span>`).join('')}</div>${ct.pdf_path ? `<div style="margin-top:14px"><button class="btn ghost sm" onclick="signedUrl('contracts','${ct.pdf_path}').then(u=>window.open(u))">Abrir contrato (PDF)</button></div>` : ''}</div>` : ''}</div>`; }
/* ===== SOLICITAÇÕES ===== */
async function requests() { const { data } = await sb.from('requests').select('*').eq('company_id', CO.id).order('created_at', { ascending: false });
  view.innerHTML = `<div class="wrap"><div class="page-title">Solicitações</div><div class="page-sub">Peça uma arte extra, um ajuste no site ou tire uma dúvida. A equipe responde por aqui.</div>
  <div class="toolbar"><span class="sp"></span><button class="btn primary" onclick="newRequest()">+ Nova solicitação</button></div>
  <div class="card"><table><thead><tr><th>Pedido</th><th>Categoria</th><th>Aberto em</th><th>Prazo</th><th>Situação</th></tr></thead><tbody>${(data || []).map(r => `<tr><td><b>${esc(r.title)}</b><br><span style="color:var(--muted);font-size:13px">${esc(r.description || '')}</span></td><td>${esc(r.category || '')}</td><td>${dtShort(r.created_at.slice(0, 10))}</td><td>${r.due_date ? dtShort(r.due_date) : '–'}</td><td><span class="badge ${{ open: '', in_progress: 'gold', done: 'ok' }[r.status]}">${{ open: 'Aberta', in_progress: 'Em andamento', done: 'Concluída' }[r.status]}</span></td></tr>`).join('') || '<tr><td colspan="5" class="empty">Nenhuma solicitação ainda.</td></tr>'}</tbody></table></div></div>`; }
function newRequest() { modal(`<h2>Nova solicitação</h2><label class="f"><span>Título</span><input id="rq_t" placeholder="ex.: arte para o Dia das Mães"></label><label class="f"><span>Categoria</span><select id="rq_c"><option>Arte extra</option><option>Ajuste em criativo</option><option>Site / página</option><option>Tráfego</option><option>Dúvida</option><option>Outro</option></select></label><label class="f"><span>Detalhes</span><textarea id="rq_d"></textarea></label><div class="md-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveRequest()">Enviar</button></div>`); }
async function saveRequest() { const { error } = await sb.from('requests').insert({ company_id: CO.id, user_id: ME.user_id, title: $('#rq_t').value, category: $('#rq_c').value, description: $('#rq_d').value }); if (error) return toast(error.message, 'bad'); closeModal(); toast('Solicitação enviada', 'ok'); route(); }
/* ===== DOCUMENTOS ===== */
async function documents() { const { data } = await sb.from('documents').select('*').eq('company_id', CO.id).order('created_at', { ascending: false }); const brand = CO.brand || {};
  view.innerHTML = `<div class="wrap"><div class="page-title">Documentos e marca</div><div class="page-sub">Logo, cores, fontes, contrato e tudo que é oficial da ${esc(CO.name)}.</div>
  <div class="grid2"><div class="card"><h3>Identidade</h3><div style="display:flex;gap:16px;align-items:center"><div class="logo-prev">${CO.logo_url ? `<img src="${esc(publicUrl('logos', CO.logo_url))}">` : '◎'}</div><div><b>${esc(CO.name)}</b><p style="color:var(--muted);font-size:13px">${esc(brand.fonts?.join(' · ') || 'Fontes a definir')}</p><div class="swatches" style="margin-top:8px">${(brand.colors || []).map(c => `<i style="background:${esc(c)}" title="${esc(c)}"></i>`).join('') || '<span style="color:var(--muted);font-size:12px">Paleta a definir</span>'}</div></div></div>${brand.tone ? `<p style="margin-top:12px;font-size:14px;color:var(--muted)">${esc(brand.tone)}</p>` : ''}</div>
  <div class="card"><h3>Arquivos</h3>${(data || []).length ? data.map(d => `<div class="kv link" onclick="signedUrl('documents','${d.storage_path}').then(u=>window.open(u))"><span>${esc(d.title)}<br><small style="color:var(--hud)">${esc(d.kind || '')} · ${dtShort(d.created_at.slice(0, 10))}</small></span><b>Abrir ›</b></div>`).join('') : '<div class="empty">Nenhum arquivo ainda.</div>'}</div></div></div>`; }
/* ===== NPS ===== */
function openNps() { modal(`<h2>De 0 a 10, o quanto você recomendaria o trabalho?</h2><div class="sub">Sua resposta vai direto pro Ben.</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${[...Array(11).keys()].map(n => `<button class="btn ghost" style="width:48px;padding:0" onclick="$$('#modal .btn.ghost').forEach(b=>b.classList.remove('primary'));this.classList.add('primary');window._nps=${n}">${n}</button>`).join('')}</div><label class="f"><span>O que faria virar 10?</span><textarea id="nps_c"></textarea></label><div class="md-actions"><button class="btn ghost" onclick="closeModal()">Depois</button><button class="btn primary" onclick="sendNps()">Enviar</button></div>`); }
async function sendNps() { if (window._nps == null) return toast('Escolha uma nota', 'bad'); const { error } = await sb.from('nps_responses').insert({ company_id: CO.id, user_id: ME.user_id, score: window._nps, comment: $('#nps_c').value }); if (error) return toast(error.message, 'bad'); closeModal(); toast('Obrigado pela resposta', 'ok'); }
/* ===== NOTIFICAÇÕES ===== */
async function loadNotifications() { const { data } = await sb.from('notifications').select('*').or(`user_id.eq.${ME.user_id},and(user_id.is.null,company_id.eq.${CO.id})`).order('created_at', { ascending: false }).limit(20); CTX.notifs = data || []; $('#bellDot').classList.toggle('hidden', !CTX.notifs.some(n => !n.read));
  $('#bell').onclick = () => openDrawer(`<div class="dr-head"><div><b>Notificações</b></div><span class="close" onclick="closeDrawer()">×</span></div>${CTX.notifs.length ? CTX.notifs.map(n => `<div class="dr-block" style="padding:14px 22px"><b style="font-size:14px">${esc(n.title)}</b><p style="font-size:13px;color:var(--muted);margin-top:4px">${esc(n.body || '')}</p><span class="mono">${dt(n.created_at.slice(0, 10))}</span></div>`).join('') : '<div class="empty">Nada por enquanto.</div>'}`); }
/* ===== PERFIL ===== */
async function openProfile() { await loadCore(); const ct = CTX.contract; const next = CTX.invoices.filter(i => ['open', 'overdue'].includes(invoiceStatus(i)))[0]; const lastPaid = [...CTX.invoices].reverse().find(i => i.status === 'paid');
  const status = !next ? ['ok', 'Em dia'] : invoiceStatus(next) === 'overdue' ? ['bad', 'Em atraso'] : daysUntil(next.due_date) <= 5 ? ['warn', 'Vence em ' + daysUntil(next.due_date) + ' dias'] : ['ok', 'Em dia'];
  const name = ME.profile?.full_name || ''; const isAdmin = CO.role === 'company_admin' || ME.is_super_admin;
  openDrawer(`<div class="dr-head"><div class="avatar" style="width:52px;height:52px;font-size:18px;border-radius:14px">${initials(name || CO.name)}</div><div><b>${esc(CO.name)}</b><p>${esc(name)} · ${esc(ME.profile?.email || '')}</p></div><span class="close" onclick="closeDrawer()">×</span></div>
  ${ME.companies.length > 1 ? `<div class="dr-block"><span class="mono">Empresa</span><select onchange="localStorage.setItem('portal_company',this.value);location.reload()">${ME.companies.map(c => `<option value="${c.id}" ${c.id === CO.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div>` : ''}
  <div class="dr-block"><span class="mono">Sua conta</span><div class="kv"><span>Cliente desde</span><b>${ct ? dt(ct.start_date) : '–'}</b></div><div class="kv"><span>Contrato</span><b>${ct ? esc(ct.number) + ' · até ' + dt(ct.end_date) : '–'}</b></div><div class="kv"><span>Responsável</span><b>Ben Hur Andrade</b></div></div>
  ${can('financial') ? `<div class="dr-block"><span class="mono">Mensalidade</span><div class="fee"><div><b>${ct ? money(ct.monthly_amount) : '–'}<small>/mês</small></b><p>${ct ? 'vence todo dia ' + ct.due_day : ''}</p></div><span class="badge ${status[0]}">${status[1]}</span></div>${next ? `<div class="kv"><span>Próximo vencimento</span><b>${dt(next.due_date)}</b></div>` : ''}${lastPaid ? `<div class="kv"><span>Última fatura</span><b>${esc(lastPaid.number)} · paga em ${dtShort(lastPaid.paid_at?.slice(0, 10))}</b></div>` : ''}<a class="btn ghost sm" style="margin-top:10px" onclick="closeDrawer();location.hash='financeiro'">Ver faturas e 2ª via</a></div>
  <div class="dr-block"><span class="mono">O que está contratado</span><div class="chips">${[...CTX.contracted].map(k => `<span>${esc(CTX.catalog.find(s => s.key === k)?.label || k)}</span>`).join('') || '<span>Sem contrato ativo</span>'}</div></div>` : ''}
  <div class="dr-block"><span class="mono">Acesso</span><div class="kv link" onclick="location.href='primeiro-acesso.html'"><span>Trocar senha</span><b>›</b></div>${isAdmin ? `<div class="kv link" onclick="openTeam()"><span>Equipe e permissões</span><b>›</b></div>` : ''}<div class="kv link" onclick="signOut()"><span>Sair</span><b>›</b></div></div>
  <p class="hint" style="padding:0 22px 22px">Contrato, mensalidade e status são atualizados pela equipe Ben Hur Andrade e aparecem aqui automaticamente.</p>`); }
/* ===== EQUIPE ===== */
async function openTeam() { const [{ data: roles }, { data: invites }] = await Promise.all([sb.from('user_roles').select('user_id, role, profiles:user_id(full_name,email)').eq('company_id', CO.id), sb.from('onboarding_tokens').select('*').eq('company_id', CO.id).is('used_at', null).order('created_at', { ascending: false })]);
  modal(`<h2>Equipe e permissões</h2><div class="sub">Você decide o que cada pessoa da ${esc(CO.name)} enxerga.</div>
  ${(roles || []).map(r => `<div class="mem"><div class="avatar" style="width:34px;height:34px;font-size:12px">${initials(r.profiles?.full_name || r.profiles?.email)}</div><div><b>${esc(r.profiles?.full_name || r.profiles?.email || 'Usuário')}</b><p>${esc(r.profiles?.email || '')}</p></div><span class="badge ${r.role === 'company_admin' ? 'ok' : ''}">${r.role === 'company_admin' ? 'Admin' : 'Gerente'}</span>${r.role === 'company_manager' ? `<a class="btn sm ghost" onclick="editPerms('${r.user_id}')">permissões</a>` : ''}</div>`).join('')}
  ${(invites || []).length ? `<div class="mono" style="margin:14px 0 6px">Convites pendentes</div>${invites.map(i => `<div class="mem"><div><b>${esc(i.full_name || i.email || 'Convite')}</b><p>${i.role === 'company_admin' ? 'Admin' : 'Gerente'} · expira ${dtShort(i.expires_at.slice(0, 10))}</p></div><a class="btn sm ghost" style="margin-left:auto" onclick="navigator.clipboard.writeText('${PORTAL.site}/entrar.html?token=${i.token}');toast('Link copiado','ok')">Copiar link</a></div>`).join('')}` : ''}
  <div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--line)"><span class="mono">Convidar novo usuário</span>
  <div class="row2"><label class="f"><span>Nome</span><input id="iv_n"></label><label class="f"><span>E-mail</span><input id="iv_e" type="email"></label></div>
  <div class="roles"><label class="on"><input type="radio" name="iv_r" value="company_manager" checked><b>Gerente</b><span>vê só o que você marcar</span></label><label><input type="radio" name="iv_r" value="company_admin"><b>Admin</b><span>vê tudo e convida pessoas</span></label></div>
  <div id="permBox"><span class="mono" style="display:block;margin:14px 0 4px">O que o gerente pode ver</span><div class="perms">${MODULES.map(m => `<label><input type="checkbox" value="${m[0]}" ${['overview', 'results_social', 'results_ads', 'creatives_view', 'roadmap'].includes(m[0]) ? 'checked' : ''}><span>${m[1]}</span></label>`).join('')}</div></div>
  <div class="md-actions"><button class="btn ghost" onclick="closeModal()">Fechar</button><button class="btn primary" onclick="invite()">Gerar convite</button></div></div>`, { width: 'min(720px,100%)' });
  $$('#modal .roles label').forEach(l => l.addEventListener('click', () => { $$('#modal .roles label').forEach(x => x.classList.remove('on')); l.classList.add('on'); $('#permBox').classList.toggle('hidden', l.querySelector('input').value === 'company_admin'); })); }
async function invite() { const role = $('#modal input[name=iv_r]:checked').value; const perms = $$('#modal .perms input:checked').map(i => i.value);
  const { data, error } = await sb.from('onboarding_tokens').insert({ company_id: CO.id, role, permissions: role === 'company_manager' ? perms : null, email: $('#iv_e').value || null, full_name: $('#iv_n').value || null, invited_by: ME.user_id }).select().single();
  if (error) return toast(error.message, 'bad'); const link = `${PORTAL.site}/entrar.html?token=${data.token}`; navigator.clipboard.writeText(link).catch(() => {}); modal(`<h2>Convite criado</h2><div class="sub">Mande este link para ${esc($('#iv_n').value || 'a pessoa')}. Vale por 7 dias.</div><div class="copybox">${link}</div><div class="md-actions"><a class="btn wa" target="_blank" href="https://wa.me/?text=${encodeURIComponent('Seu acesso ao painel da ' + CO.name + ': ' + link)}">Enviar por WhatsApp</a><button class="btn primary" onclick="closeModal()">Pronto</button></div>`); }
async function editPerms(uid) { const { data } = await sb.from('user_permissions').select('module_key,allowed').eq('company_id', CO.id).eq('user_id', uid); const set = new Set((data || []).filter(p => p.allowed).map(p => p.module_key));
  modal(`<h2>Permissões do gerente</h2><div class="perms">${MODULES.map(m => `<label><input type="checkbox" value="${m[0]}" ${set.has(m[0]) ? 'checked' : ''}><span>${m[1]}</span></label>`).join('')}</div><div class="md-actions"><button class="btn ghost" onclick="openTeam()">Voltar</button><button class="btn primary" onclick="savePerms('${uid}')">Salvar</button></div>`); }
async function savePerms(uid) { const rows = $$('#modal .perms input').map(i => ({ user_id: uid, company_id: CO.id, module_key: i.value, allowed: i.checked })); const { error } = await sb.from('user_permissions').upsert(rows); if (error) return toast(error.message, 'bad'); toast('Permissões salvas', 'ok'); openTeam(); }
boot();
</script></body></html>
